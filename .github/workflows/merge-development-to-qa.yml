name: Merge Development to QA
 
on:

  push:

    branches:

      - development
 
permissions:

  contents: write
 
jobs:

  merge-development-to-qa:

    runs-on: ubuntu-latest
 
    steps:

      - name: Checkout

        uses: actions/checkout@v4

        with:

          fetch-depth: 0
 
      - name: Merge development into qa

        run: |

          git config user.name "github-actions"

          git config user.email "github-actions@github.com"
 
          git fetch origin
 
          git checkout qa

          git pull origin qa
 
          git merge origin/development --no-edit
 
          git push https://${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git qa
 
